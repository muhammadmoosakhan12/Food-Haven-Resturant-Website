<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Food Haven Restaurant</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
     <header>
      <nav class="menu-nav">
        <ul>
            <li><a href="index.html">Home</a>&emsp;&emsp;&emsp;</li>
          <li><a href="menu.html">Menu</a>&emsp;&emsp;&emsp;</li>
          <li><a href="about.html">About Us</a>&emsp;&emsp;&emsp;</li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </header>

    
    <div class="section-contact-us" id="section-contact">
      <h1>Contact Us</h1>
      <p>Have a question or want to get in touch with us? Fill out the form below and our team will be happy to help.</p>
    </div>

    <div class="from-section">
        <h1>Form</h1>
        <form action="" method="post">
            <label for="username">Name:
            <input type="text" name="username" required autofocus id="username">
            </label><br><br>

             <form action="" method="post">
            <label for="email">Email:
            <input type="email" name="email" required autofocus id="email">
            </label><br><br>

             <form action="" method="post">
            <label for="number">Number:
            <input type="number" name="number" required autofocus id="number">
            </label><br><br>

            <form action="" method="post">
            <label for="subject">Subject:
            <input type="text" name="subject" required autofocus id="subject">
            </label><br><br>

            <label id="food-preference-label">
                Food Preference:<br>
                <input type="radio" name="foodtype" value="vegetarian" >Vegetarian<br>
                <input type="radio" name="foodtype" value="non-vegetarian" >Non-Vegetarian
            </label><br><br>

            <label for="massage">Massage:
                
                <textarea name="massage" id="massage"></textarea>
            </label><br><br>

            <input type="submit" class="submit-btn">
        </form>
    </div>
</body>
</html>
